<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: system-ui, sans-serif;
    }

    .calc {
      background: #222;
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.07);
      padding: 20px;
      width: 300px;
    }

    /* Display */
    .display {
      background: #1c1c1c;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      border: 1px solid #333;
    }

    .display .expression {
      font-size: 0.85rem;
      color: #666;
      min-height: 1.2em;
      word-break: break-all;
      text-align: right;
    }

    .display .value {
      font-size: 2.2rem;
      font-weight: 300;
      color: #fff;
      word-break: break-all;
      text-align: right;
      line-height: 1.1;
    }

    .display .value.error {
      font-size: 1rem;
      color: #f87171;
    }

    /* Button grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      height: 58px;
      transition: filter 0.1s, transform 0.08s;
      box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.4);
    }

    /* Number buttons */
    .btn-num {
      background: #3a3a3a;
      color: #fff;
    }
    .btn-num:hover { filter: brightness(1.2); }

    /* Operator buttons */
    .btn-op {
      background: #f59e0b;
      color: #fff;
    }
    .btn-op:hover { filter: brightness(1.1); }
    .btn-op.active { background: #fff; color: #f59e0b; }

    /* Power button */
    .btn-pow {
      background: #8b5cf6;
      color: #fff;
    }
    .btn-pow:hover { filter: brightness(1.1); }
    .btn-pow.active { background: #fff; color: #8b5cf6; }

    /* Utility buttons */
    .btn-util {
      background: #555;
      color: #fff;
      font-size: 0.95rem;
    }
    .btn-util:hover { filter: brightness(1.2); }

    /* Equals */
    .btn-eq {
      background: #f59e0b;
      color: #fff;
      font-size: 1.4rem;
    }
    .btn-eq:hover { filter: brightness(1.1); }

    /* Span two columns */
    .span2 { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calc">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="value" id="display">0</div>
    </div>

    <div class="buttons">
      <!-- Row 1 -->
      <button class="btn-util span2" onclick="clearAll()">AC</button>
      <button class="btn-util" onclick="backspace()">⌫</button>
      <button class="btn-op" id="op-divide" onclick="setOp('divide')">÷</button>

      <!-- Row 2 -->
      <button class="btn-num" onclick="input('7')">7</button>
      <button class="btn-num" onclick="input('8')">8</button>
      <button class="btn-num" onclick="input('9')">9</button>
      <button class="btn-op" id="op-multiply" onclick="setOp('multiply')">×</button>

      <!-- Row 3 -->
      <button class="btn-num" onclick="input('4')">4</button>
      <button class="btn-num" onclick="input('5')">5</button>
      <button class="btn-num" onclick="input('6')">6</button>
      <button class="btn-op" id="op-subtract" onclick="setOp('subtract')">−</button>

      <!-- Row 4 -->
      <button class="btn-num" onclick="input('1')">1</button>
      <button class="btn-num" onclick="input('2')">2</button>
      <button class="btn-num" onclick="input('3')">3</button>
      <button class="btn-op" id="op-add" onclick="setOp('add')">+</button>

      <!-- Row 5 -->
      <button class="btn-pow" id="op-power" onclick="setOp('power')">xʸ</button>
      <button class="btn-num" onclick="input('0')">0</button>
      <button class="btn-num" onclick="input('.')">.</button>
      <button class="btn-eq" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let current = '0';
    let operand = null;
    let operator = null;
    let justCalc = false;

    const ops = {
      add:      (a, b) => a + b,
      subtract: (a, b) => a - b,
      multiply: (a, b) => a * b,
      divide:   (a, b) => { if (b === 0) throw new Error('Cannot divide by zero'); return a / b; },
      power:    (a, b) => Math.pow(a, b),
    };
    const symbols = { add: '+', subtract: '−', multiply: '×', divide: '÷', power: '^' };

    function updateDisplay(val, expr = '', isError = false) {
      const d = document.getElementById('display');
      d.textContent = val;
      d.className = 'value' + (isError ? ' error' : '');
      document.getElementById('expression').textContent = expr;
    }

    function input(ch) {
      if (justCalc) { current = '0'; justCalc = false; }
      if (ch === '.' && current.includes('.')) return;
      current = (current === '0' && ch !== '.') ? ch : current + ch;
      updateDisplay(current);
    }

    function setOp(op) {
      justCalc = false;
      // Chain: if already have operand + operator, evaluate first
      if (operand !== null && operator && !justCalc) {
        try {
          const result = ops[operator](parseFloat(operand), parseFloat(current));
          current = fmt(result);
        } catch (e) {
          updateDisplay(e.message, '', true);
          operand = null; operator = null;
          return;
        }
      }
      operand = current;
      operator = op;
      current = '0';
      updateDisplay('0', `${operand} ${symbols[op]}`);
      // Highlight active op button
      document.querySelectorAll('.btn-op, .btn-pow').forEach(b => b.classList.remove('active'));
      document.getElementById('op-' + op).classList.add('active');
    }

    function calculate() {
      if (operand === null || operator === null) return;
      const a = parseFloat(operand), b = parseFloat(current);
      const expr = `${operand} ${symbols[operator]} ${current} =`;
      try {
        const result = ops[operator](a, b);
        current = fmt(result);
        updateDisplay(current, expr);
      } catch (e) {
        updateDisplay(e.message, expr, true);
      }
      operand = null; operator = null; justCalc = true;
      document.querySelectorAll('.btn-op, .btn-pow').forEach(b => b.classList.remove('active'));
    }

    function clearAll() {
      current = '0'; operand = null; operator = null; justCalc = false;
      updateDisplay('0', '');
      document.querySelectorAll('.btn-op, .btn-pow').forEach(b => b.classList.remove('active'));
    }

    function backspace() {
      if (justCalc) return;
      current = current.length > 1 ? current.slice(0, -1) : '0';
      updateDisplay(current);
    }

    function fmt(n) {
      if (!isFinite(n)) return 'Error';
      const s = parseFloat(n.toFixed(10)).toString();
      return s;
    }

    // Keyboard support
    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') input(e.key);
      else if (e.key === '.') input('.');
      else if (e.key === '+') setOp('add');
      else if (e.key === '-') setOp('subtract');
      else if (e.key === '*') setOp('multiply');
      else if (e.key === '/') { e.preventDefault(); setOp('divide'); }
      else if (e.key === '^') setOp('power');
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Backspace') backspace();
      else if (e.key === 'Escape') clearAll();
    });
  </script>
</body>
</html>
